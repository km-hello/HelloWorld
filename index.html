<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta
        name="description"
        content="Hello World presented over a real-time three-dimensional three-body simulation."
    >
    <title>Hello World · Three Body Simulation</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <canvas
        class="cosmic-scene"
        data-three-body
        aria-hidden="true"
    ></canvas>

    <main class="container">
        <h1 class="hello">HELLO WORLD !</h1>
    </main>

    <noscript class="noscript-message">
        JavaScript is required to render the three-body monument.
    </noscript>
</body>
</html>
